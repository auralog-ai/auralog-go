name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=auralogs-go-${GITHUB_REF_NAME}/ \
            -o auralogs-go-${GITHUB_REF_NAME}.tar.gz HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: auralogs-go-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
